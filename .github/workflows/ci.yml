name: Production-Grade CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
        - 'k8s/**'
        - '**.md'
        - '.gitignore'

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Grants permission to commit updated k8s/deployment.yml back to Git
      packages: write   # Grants permission to push container images to ghcr.io

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up QEMU for multi-architecture emulation (AMD64 & ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Authenticate with GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Extract Git metadata for Docker tags (generates sha-<SHORT_SHA> and 'latest')
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # 6. Build single-architecture image locally for fast security scanning
      - name: Build Image Locally for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-image:test

      # 7. Security Scan with Trivy (Aborts workflow if CRITICAL/HIGH vulnerabilities exist)
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-image:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 8. Push Multi-Arch Image (AMD64 + ARM64) to GHCR (Executes only if Trivy scan succeeds)
      - name: Push Multi-Arch Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 9. Update image tag in k8s/deployment.yml (matches sha-<SHORT_SHA> format)
      - name: Update Image Tag in Manifest
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}|g" k8s/deployment.yml

      # 10. Commit and push manifest update back to main branch ([skip ci] prevents infinite loops)
      - name: Commit and Push Updated Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yml
          git commit -m "chore(cd): update image tag to sha-${SHORT_SHA} [skip ci]" || echo "No changes to commit"
          git push