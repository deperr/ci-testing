name: Production-Grade CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Grants permission to commit updated k8s/deployment.yaml back to Git
      packages: write   # Grants permission to push container images to ghcr.io

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Buildx for layer caching and local image loading
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate with GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract Git metadata for Docker tags (short SHA and 'latest')
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # 5. Build the image locally (Gated before registry push)
      - name: Build Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-image:test

      # 6. Security Scan with Trivy (Aborts workflow if CRITICAL/HIGH vulnerabilities exist)
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-image:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 7. Push image to GHCR (Only executes if Trivy scan succeeds)
      - name: Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Update image tag in k8s/deployment.yml with sha- prefix
      - name: Update Image Tag in Manifest
        run: |
          SHORT_SHA=${{ github.sha }}
          SHORT_SHA=${SHORT_SHA:0:7}
          sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}|g" k8s/deployment.yml

      # 9. Commit and push manifest update back to main branch (with [skip ci] to prevent infinite loops)
      - name: Commit and Push Updated Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yml
          git commit -m "chore(cd): update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push